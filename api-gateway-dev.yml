server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
              include-expression: serviceId.toLowerCase().contains('inventory-service') || serviceId.toLowerCase().contains('unit-of-measure-service')
          routes:
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=3
            - id: unit-of-measure-service
              uri: lb://unit-of-measure-service
              predicates:
                - Path=/api/v1/uom/**
              filters:
                - StripPrefix=3

springdoc:
  swagger-ui:
    urls:
      - name: inventory
        url: /api/v1/inventory/v3/api-docs
      - name: uom
        url: /api/v1/uom/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    metadata-map:
      version: 1.0.0
      environment: development
      region: us-east
    prefer-ip-address: true